---
###############################
# GlueStick frontend: one network pass per image pair for both the point
# matches and the line matches, instead of running a point matcher and
# GlueStick over the same pairs separately.
base_config_file: "cfgs/structure_triangulation/default.yaml"

_image_description:
  # No point_detection here: the joint matcher's keypoints come out of the
  # same SuperPoint pass that describes the lines, so the description step
  # exports those rather than running a second detector over the same images.
  line_detection:
    detector_method: "deeplsd"
    extractor_method: "wireframe"

_image_association:
  # The joint matcher supplies both halves, so the inherited point_matcher and
  # line_matcher settings are unused here.
  use_joint_point_line_matcher: True
  joint_point_line_matcher:
    method: "gluestick"
