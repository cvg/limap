name: limap

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

jobs:
  build:
    name: ${{ matrix.config.os }} ${{ matrix.config.arch }} with Python ${{ matrix.config.python-version }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [
          {os: ubuntu-latest, python-version: "3.10"},
          {os: ubuntu-latest, python-version: "3.11"},
          {os: ubuntu-latest, python-version: "3.12"},
        ]
    env:
      COMPILER_CACHE_VERSION: 1
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-builds
        with:
          key: limap-v${{ env.COMPILER_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: limap-v${{ env.COMPILER_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}
          path: ${{ env.COMPILER_CACHE_DIR }}

      - name: Set env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            libboost-program-options-dev \
            libboost-graph-dev \
            libboost-system-dev \
            libeigen3-dev \
            libceres-dev \
            libflann-dev \
            libopenimageio-dev \
            openimageio-tools \
            libmetis-dev \
            libgoogle-glog-dev \
            libgtest-dev \
            libgmock-dev \
            libsqlite3-dev \
            libglew-dev \
            qtbase5-dev \
            libqt5opengl5-dev \
            libcgal-dev \
            libcgal-qt5-dev \
            libgl1-mesa-dri \
            libunwind-dev \
            xvfb

          # Fix issue in Ubuntu's openimageio CMake config.
          # We don't depend on any of openimageio's OpenCV functionality,
          # but its config still requires the OpenCV include directory to exist.
          sudo mkdir -p /usr/include/opencv4

      - name: Set up Python ${{ matrix.config.python-version  }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.config.python-version  }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true

      - name: Clean workspace artifacts
        run: rm -rf build/ dist/ *.egg-info/ .eggs/

      - name: Install Python dependencies
        run: |
          git submodule update --init --recursive
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        run:  python -m pip install -v .

      - name: Run Python tests
        run:  python -c "import limap; print(limap.__version__)"

      - name: Run tests
        run: |
          pytest -m ci_workflow tests

      - name: Run E2E tests
        run: |
          bash scripts/quickstart.sh
          python runners/hypersim/geometry_guided_line_reconstruction.py \
              --default_config_file cfgs/geometry_guided_line_reconstruction/default_cpu.yaml \
              --output_dir outputs/quickstart_test
          python runners/hypersim/structure_triangulation.py \
              --default_config_file cfgs/structure_triangulation/default_cpu.yaml \
              --output_dir outputs/quickstart_test --skip_exists
          python -m limap.cli.automatic_point_line_triangulation \
              -m outputs/quickstart_test/init_model \
              -i data/ai_001_001/images/scene_cam_00_final_preview \
              -o outputs/quickstart_test_colmap \
              -c cfgs/structure_triangulation/default_cpu.yaml \
              --max_image_dim 800

      - name: Check E2E reconstructions are non-empty
        run: |
          # Geometry-guided fits lines to depth and triangulates no points.
          python scripts/check_reconstruction.py \
              outputs/quickstart_test/geometry_guided_final_model \
              --min-points 0
          python scripts/check_reconstruction.py \
              outputs/quickstart_test/final_model
          python scripts/check_reconstruction.py \
              outputs/quickstart_test_colmap/final_model

