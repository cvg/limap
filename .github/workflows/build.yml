name: limap

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

jobs:
  build:
    name: ${{ matrix.config.os }} with Python ${{ matrix.config.python-version }}
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        config: [
          {
            os: ubuntu-24.04,
            python-version: "3.10",
            checkCodeFormat: false,
            cppTests: false,
            e2eTests: true,
          },
          {
            os: ubuntu-24.04,
            python-version: "3.11",
            checkCodeFormat: false,
            cppTests: true,
            e2eTests: false,
          },
          {
            os: ubuntu-24.04,
            python-version: "3.12",
            checkCodeFormat: true,
            cppTests: false,
            e2eTests: false,
          },
          # 3.13: every core dependency supports it. open3d does not, but it
          # is confined to the `viz` extra behind a python_version marker, so
          # `.[all]` resolves without it here -- nothing outside
          # limap.visualize calls into it. What is genuinely unverified is the
          # git-sourced detector stack (hloc, deeplsd, gluestick, pytlsd,
          # pxwplanar), which this job does install. Run it for signal without
          # letting it block merges; drop `experimental` once reliably green.
          {
            os: ubuntu-24.04,
            python-version: "3.13",
            checkCodeFormat: false,
            cppTests: false,
            e2eTests: false,
            experimental: true,
          },
        ]

    env:
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # scikit-build-core and the ctest configure use different build trees.
      # Do not let the directory name take part in the hash.
      CCACHE_NOHASHDIR: "true"
      # Hosted runner compiler mtimes change even when contents do not.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      # Shared between the scikit-build-core build and the ctest configure so
      # COLMAP/PoseLib/JLinkage/libigl are fetched once per job. Deliberately
      # outside COMPILER_CACHE_DIR: these trees are far too large to persist.
      FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/fetchcontent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.config.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.config.python-version }}

      - name: Check code format
        if: matrix.config.checkCodeFormat
        run: |
          set +x -euo pipefail
          python -m pip install ruff==0.15.20 clang-format==22.1.5
          ./scripts/format/c++.sh --all
          ./scripts/format/python.sh --all
          git diff --name-only
          git diff --exit-code || (echo "Code formatting failed" && exit 1)

      - name: Restore compiler cache
        uses: ./.github/actions/compiler-cache
        id: cache-compiler
        with:
          mode: restore
          path: ${{ env.COMPILER_CACHE_DIR }}
          key-suffix: ${{ matrix.config.os }}-py${{ matrix.config.python-version }}

      - name: Install compiler cache
        run: |
          mkdir -p "$CCACHE_DIR" "$FETCHCONTENT_CACHE_DIR"
          echo "$COMPILER_CACHE_DIR/bin" >> $GITHUB_PATH

          if [ ! -f "$COMPILER_CACHE_DIR/bin/ccache" ]; then
            set -x
            wget https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz
            echo "508b2a1217dc6e04a23e967c7b95a0fb45d8a7e16fde9e180919698f2e2be060  ccache-4.13.6-linux-x86_64-glibc.tar.xz" | sha256sum --check
            tar xf ccache-4.13.6-linux-x86_64-glibc.tar.xz
            mkdir -p "$COMPILER_CACHE_DIR/bin"
            mv ./ccache-4.13.6-linux-x86_64-glibc/ccache "$COMPILER_CACHE_DIR/bin"
          fi
          "$COMPILER_CACHE_DIR/bin/ccache" --zero-stats

      - name: Setup Ubuntu
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            libboost-program-options-dev \
            libboost-graph-dev \
            libboost-system-dev \
            libeigen3-dev \
            libceres-dev \
            libflann-dev \
            libopenimageio-dev \
            openimageio-tools \
            libmetis-dev \
            libgoogle-glog-dev \
            libgtest-dev \
            libgmock-dev \
            libsqlite3-dev \
            libglew-dev \
            qtbase5-dev \
            libqt5opengl5-dev \
            libcgal-dev \
            libcgal-qt5-dev \
            libgl1-mesa-dri \
            libunwind-dev \
            xvfb

          # Fix issue in Ubuntu's openimageio CMake config.
          # We don't depend on any of openimageio's OpenCV functionality,
          # but its config still requires the OpenCV include directory to exist.
          sudo mkdir -p /usr/include/opencv4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        run: |
          python -m pip install -v ".[all,dev]" \
            -Cbuild-dir=build \
            -Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            -Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -Ccmake.define.FETCHCONTENT_BASE_DIR="${FETCHCONTENT_CACHE_DIR}"

      - name: Check import
        run: python -c "import limap; print(limap.__version__)"

      - name: Run Python tests
        run: pytest -m ci_workflow tests

      - name: Build and run C++ tests
        if: matrix.config.cppTests
        run: |
          cmake -B cmake-build-tests -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIMAP_TESTS_ENABLED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_CACHE_DIR}" \
            .
          cmake --build cmake-build-tests -j "$(nproc)"
          ctest --test-dir cmake-build-tests --output-on-failure

      - name: Run E2E tests
        if: matrix.config.e2eTests
        run: |
          bash scripts/quickstart.sh
          python runners/hypersim/geometry_guided_line_reconstruction.py \
              --default_config_file cfgs/geometry_guided_line_reconstruction/default_cpu.yaml \
              --output_dir outputs/quickstart_test
          # Geometry-guided fits lines to depth and triangulates no points.
          python scripts/check_reconstruction.py \
              outputs/quickstart_test/geometry_guided_final_model \
              --min-points 0
          python runners/hypersim/structure_triangulation.py \
              --default_config_file cfgs/structure_triangulation/default_cpu.yaml \
              --output_dir outputs/quickstart_test --skip_exists
          python scripts/check_reconstruction.py \
              outputs/quickstart_test/final_model
          python -m limap.cli.automatic_point_line_triangulation \
              -m outputs/quickstart_test/init_model \
              -i data/ai_001_001/images/scene_cam_00_final_preview \
              -o outputs/quickstart_test_colmap \
              -c cfgs/structure_triangulation/default_cpu.yaml \
              --max_image_dim 800
          python scripts/check_reconstruction.py \
              outputs/quickstart_test_colmap/final_model

      - name: Show compiler cache stats
        if: always()
        run: |
          ccache --show-stats --verbose || true

      - name: Save compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          mode: save
          key: ${{ steps.cache-compiler.outputs.key }}
          path: ${{ env.COMPILER_CACHE_DIR }}
          cache-hit: ${{ steps.cache-compiler.outputs.cache-hit }}
          ccache-dir: ${{ env.CCACHE_DIR }}
