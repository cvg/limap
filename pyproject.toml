[build-system]
requires = [
  "scikit-build-core>=0.10",
  "cmake>=3.18",
  "pybind11>=2.11",        
]
build-backend = "scikit_build_core.build"


[project]
name = "limap"
version = "2.0.0.dev"
description = "A toolbox for mapping and localization with line features"
authors = [
  { name = "Shaohui Liu", email = "b1ueber2y@gmail.com" },
  { name = "Yifan Yu", email = "markyu98@outlook.com" },
  { name = "Rémi Pautrat", email = "pautratrmi@microsoft.com" },
]
urls = {Repository = "https://github.com/cvg/limap"}
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[tool.scikit-build]
cmake.source-dir = "./"
wheel.packages = ["src/limap"]
cmake.define.VERSION_INFO = "2.0.0.dev"

[tool.cibuildwheel]
# requires-python is >=3.10,<3.13.
build = "cp3{10,11,12}-{macosx,manylinux,win}*"
archs = ["auto64"]
# A fresh PEP 517 isolation directory changes compiler include paths on every
# run, preventing ccache reuse. Install the build requirements into the stable
# cibuildwheel environment instead.
build-frontend = {name = "build", args = ["--no-isolation"]}
before-build = "python {project}/misc/ci/install-build-requirements.py"
# Only a smoke test: the pytest suite needs torch and the git-sourced
# detectors from requirements.txt, which are not wheel dependencies.
test-command = "python -c \"import limap; print(limap.__version__)\""

[tool.cibuildwheel.linux]
before-all = "{project}/misc/ci/install-deps-almalinux.sh"

[tool.cibuildwheel.macos]
before-all = "{project}/misc/ci/install-deps-macos.sh"

[tool.cibuildwheel.windows]
before-all = "pwsh -File {project}/misc/ci/install-deps-windows.ps1"
before-build = "python {project}/misc/ci/install-build-requirements.py && pip install delvewheel"
