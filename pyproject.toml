[build-system]
requires = [
  # >=0.11 for PEP 639 license metadata (License-Expression).
  "scikit-build-core>=0.11",
  "cmake>=3.18",
  # Must match COLMAP's pin: limap's bindings inherit pycolmap's types.
  "pybind11==3.0.4",
]
build-backend = "scikit_build_core.build"


[project]
name = "pylimap"
version = "2.0.0"
description = "A toolbox for 3D visual mapping, localization, and SfM with structured geometric features (points, lines, planes, vanishing points, wireframes, etc.)."
authors = [
  { name = "Shaohui Liu", email = "b1ueber2y@gmail.com" },
  { name = "Yifan Yu", email = "markyu98@outlook.com" },
  { name = "Rémi Pautrat", email = "pautratrmi@microsoft.com" },
]
urls = {Repository = "https://github.com/cvg/limap"}
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
# Capped below 3.14 until dacite supports it: limap converts every YAML config
# into an Options dataclass through dacite.from_dict, which relies on runtime
# annotation introspection -- exactly what 3.14's deferred annotations change.
requires-python = ">=3.10,<3.14"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "pycolmap==4.2.0",
  "pyyaml",
  "tqdm",
  "scipy",
  # Overrides gluestick's opencv-python==4.7.0.* pin: 4.10 is the first
  # release built against NumPy 2, below which `import cv2` fails.
  "opencv-python>=4.10",
  "typeguard",
  "dacite",
  "joblib",
  "h5py",
  "omegaconf",
  "imagesize",
  "plyfile",
  "bresenham",
]

[project.optional-dependencies]
viz = [
  "matplotlib",
  "seaborn",
  # open3d ships no wheels for 3.13+. All 3D visualization depends on it, so
  # on 3.13 the viewers do not work at all; reconstruction is unaffected.
  "open3d==0.19.0; python_version < '3.13'",
]
# PyPI-installable support for the 2D line detectors and matchers. The
# detectors themselves (pytlsd, deeplsd, gluestick, hloc) are sourced from git
# and cannot be declared here, because PyPI rejects direct references in
# project metadata -- install requirements.txt for those.
line2d = ["einops", "scikit-image", "pillow"]
dev = ["pytest", "ruff==0.15.20", "clang-format==22.1.5"]
all = ["pylimap[viz,line2d]"]

[tool.scikit-build]
cmake.source-dir = "./"
wheel.packages = ["src/limap"]

[tool.cibuildwheel]
# requires-python is >=3.10,<3.14.
build = "cp3{10,11,12,13}-{macosx,manylinux,win}*"
archs = ["auto64"]
# A fresh PEP 517 isolation directory changes compiler include paths on every
# run, preventing ccache reuse. Install the build requirements into the stable
# cibuildwheel environment instead.
build-frontend = {name = "build", args = ["--no-isolation"]}
before-build = "python {project}/misc/ci/install-build-requirements.py"
# Only a smoke test: the pytest suite needs torch and the git-sourced
# detectors from requirements.txt, which are not wheel dependencies.
test-command = "python -c \"import limap; print(limap.__version__)\""

[tool.cibuildwheel.linux]
before-all = "{project}/misc/ci/install-deps-almalinux.sh"

[tool.cibuildwheel.macos]
before-all = "{project}/misc/ci/install-deps-macos.sh"

[tool.cibuildwheel.windows]
before-all = "pwsh -File {project}/misc/ci/install-deps-windows.ps1"
before-build = "python {project}/misc/ci/install-build-requirements.py && pip install delvewheel"
